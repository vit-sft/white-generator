<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="icon" type="image/webp" sizes="16x16" href="static/img/icon.webp" />
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="#hero" class="nav-logo">{title}</a>
            <a href="#about">About</a>
            <a href="#screenshots">Screenshots</a>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="hero-content">
                <img src="{logo_path}" alt="Logo" class="logo">
                <p class="purchases-title">In-app purchases</p>
                <h1>{title}</h1>
                <a class="download-btn" href="{app_url}">Download</a>
            </div>
        </section>
        {components_html}
    </main>
    
    <footer class="footer">
        <p>{title} &copy; 2025</p>
        {cookie_html}
    </footer>

</body>
</html>
