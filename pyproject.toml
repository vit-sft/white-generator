[project]
name = "white-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=2.24.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.0",
    "beautifulsoup4>=4.14.2",
    "cachetools>=6.2.1",
    "google-ai-generativelanguage>=0.6.15",
    "google-api-python-client>=2.185.0",
    "google-genai>=1.46.0",
    "httpx>=0.28.1",
    "pathspec>=0.12.1",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["white_generator"]
